name: Update OKX SOL Perpetual Candles and Funding Rate

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时定时运行
  workflow_dispatch:         # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OKX SOL data update script
        run: python download_okx_sol_perp_klines.py

      - name: Commit and push updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            DATA/SOL-USDT-SWAP_5m_103680_confirmed.csv \
            DATA/SOL-USDT-SWAP_15m_34560_confirmed.csv \
            DATA/SOL-USDT-SWAP_30m_17280_confirmed.csv \
            DATA/SOL-USDT-SWAP_1H_8640_confirmed.csv \
            DATA/SOL-USDT-SWAP_2H_4320_confirmed.csv \
            DATA/SOL-USDT-SWAP_4H_2160_confirmed.csv \
            DATA/SOL-USDT-SWAP_funding_rate_confirmed.csv \
            DATA/metadata.json
          git commit -m "chore(data): update OKX SOL-USDT-SWAP candles (incl. 4H) and funding rate" || echo "no changes to commit"
          git push