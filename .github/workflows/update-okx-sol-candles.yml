name: Update OKX SOL perpetual candles

on:
  schedule:
    # GitHub evaluates cron in UTC. UTC 00:07, 02:07, ... maps exactly to
    # Beijing time 08:07, 10:07, ...; across midnight this is every two hours
    # at :07 Beijing time as well.
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Force a full 180-day historical refresh for every timeframe"
        required: false
        default: false
        type: boolean

# Use Beijing time consistently in shell output and in Git's local commit offset.
env:
  TZ: Asia/Shanghai

# Required for the workflow's built-in GITHUB_TOKEN to commit updated CSV data.
permissions:
  contents: write

# A scheduled run must not overlap a slow/manual run; queue rather than cancel it.
concurrency:
  group: okx-sol-candle-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-candles:
    name: Incrementally update Beijing-time CSV data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate newly closed candles
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow time (Beijing): $(date '+%Y-%m-%d %H:%M:%S %z')"
          if [[ "${{ github.event.inputs.full_refresh }}" == "true" ]]; then
            python3 download_okx_sol_perp_klines.py --full-refresh
          else
            python3 download_okx_sol_perp_klines.py
          fi

      - name: Commit and push data changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            SOL-USDT-SWAP_15m_180d_confirmed.csv \
            SOL-USDT-SWAP_30m_180d_confirmed.csv \
            SOL-USDT-SWAP_1H_180d_confirmed.csv \
            SOL-USDT-SWAP_2H_180d_confirmed.csv \
            metadata.json

          if git diff --cached --quiet; then
            echo "No new completed candles or metadata changes; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: incrementally update OKX SOL candles (Beijing time)"
          git push
