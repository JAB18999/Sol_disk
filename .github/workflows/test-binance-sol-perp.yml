name: Test Binance SOL perpetual access

on:
  workflow_dispatch:
  push:
    paths:
      - "test_binance_sol_perp_access.py"
      - ".github/workflows/test-binance-sol-perp.yml"

# Run in Beijing time for consistent log timestamps.
env:
  TZ: Asia/Shanghai

jobs:
  probe-binance:
    name: Probe Binance SOL-USDT perpetual API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Binance connectivity probe
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner time (Beijing): $(date '+%Y-%m-%d %H:%M:%S %z')"
          python3 test_binance_sol_perp_access.py
