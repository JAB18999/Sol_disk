name: MA Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '回测模式：train / validate / test / all'
        required: true
        default: 'all'
        type: choice
        options:
          - train
          - validate
          - test
          - all

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/ma-strategy/backtest/requirements.txt

      - name: Run backtest
        run: |
          python research/ma-strategy/backtest/backtest.py --mode ${{ inputs.mode || 'all' }} --data-dir DATA > research/ma-strategy/backtest/artifacts/backtest.log 2>&1

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ma-strategy-backtest-results
          path: research/ma-strategy/backtest/artifacts/
          retention-days: 30