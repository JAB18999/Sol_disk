name: Probe FTP ports

# Temporary diagnostic: scan common FTP ports from a GitHub Actions runner
# so we can tell which port the FTP server is actually listening on.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan ports
        run: |
          python3 - <<'PY'
          import concurrent.futures, socket

          HOST = "119.91.226.180"
          # Focused scan: 2121 (control) + every 100 ports in 10000-10100 range
          PORTS = (
              [2121]
              + list(range(10000, 10101))  # passive data range
          )

          def probe(port):
              s = socket.socket()
              s.settimeout(4)
              try:
                  s.connect((HOST, port))
                  banner = b""
                  try:
                      s.settimeout(3)
                      banner = s.recv(200)
                  except Exception:
                      pass
                  return (port, "OPEN", banner[:120].decode("utf-8", "replace").strip())
              except ConnectionRefusedError:
                  return (port, "refused", "")
              except socket.timeout:
                  return (port, "timeout/filtered", "")
              except Exception as exc:
                  return (port, type(exc).__name__, "")
              finally:
                  s.close()

          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as pool:
              results = list(pool.map(probe, PORTS))

          print(f"Target: {HOST}")
          print("-" * 60)
          for port, state, banner in sorted(results):
              if state == "OPEN":
                  print(f"port {port:>6}: OPEN      banner={banner!r}")
          print("-" * 60)
          closed = [p for p, s, _ in results if s == "refused"]
          filtered = [p for p, s, _ in results if s.startswith("timeout")]
          print(f"OPEN: {[p for p,s,_ in sorted(results) if s=='OPEN']}")
          print(f"refused (host up, nothing listening) count={len(closed)}: {sorted(closed)}")
          print(f"timeout/filtered count={len(filtered)}: {sorted(filtered)}")

          # Control test: known-good public FTP servers, to prove whether the
          # runner has usable outbound FTP at all.
          print("-" * 60)
          print("CONTROL (public FTP reachability from this runner):")
          for host in ("ftp.gnu.org", "test.rebex.net", "speedtest.tele2.net"):
              try:
                  s = socket.create_connection((host, 21), timeout=8)
                  s.settimeout(5)
                  banner = s.recv(200)
                  print(f"  {host}:21 -> OPEN banner={banner[:80]!r}")
                  s.close()
              except Exception as exc:
                  print(f"  {host}:21 -> {type(exc).__name__}: {exc}")
          PY
